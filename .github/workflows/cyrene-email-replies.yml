name: Prepare Cyrene email replies
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyrene-email-replies
  cancel-in-progress: false

jobs:
  prepare-replies:
    if: ${{ vars.CYRENE_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check inbox and save Cyrene replies as drafts
        env:
          CYRENE_WORKER_URL: ${{ vars.CYRENE_WORKER_URL }}
          CYRENE_API_TOKEN: ${{ secrets.CYRENE_API_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANNOUNCEMENT_EMAIL_TO: theomgvirus@gmail.com
        run: python .github/scripts/process_cyrene_replies.py
