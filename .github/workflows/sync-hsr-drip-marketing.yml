name: Sync HSR drip marketing archive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsr-drip-marketing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download new drip marketing artwork and update index
        run: python .github/scripts/sync_hsr_drip_marketing.py

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsr/drip-marketing/
          if git diff --cached --quiet; then
            echo "Drip marketing archive is already up to date."
          else
            git commit -m "chore: sync HSR drip marketing artwork"
            git push
          fi
