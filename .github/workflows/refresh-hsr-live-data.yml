name: Refresh HSR live data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsr-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and validate independent HSR feeds
        run: python .github/scripts/refresh_hsr_live_data.py

      - name: Publish updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsr/live-data.json
          if git diff --cached --quiet; then
            echo "HSR live data snapshot is unchanged."
          else
            git commit -m "chore: refresh HSR live data snapshot"
            git push
          fi
