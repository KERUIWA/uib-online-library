name: Refresh HSR live data
# Validates hsr.html before publishing the same-origin live snapshot.

on:
  push:
    paths:
      - "hsr.html"
      - "assets/hsr/live-data.json"
      - ".github/scripts/refresh_hsr_live_data.py"
      - ".github/workflows/refresh-hsr-live-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsr-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node for inline JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HSR page JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("hsr.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in hsr.html")
          Path("/tmp/hsr-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/hsr-inline.js

      - name: Fetch and validate independent HSR feeds
        run: python .github/scripts/refresh_hsr_live_data.py

      - name: Publish updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsr/live-data.json
          if git diff --cached --quiet; then
            echo "HSR live data snapshot is unchanged."
          else
            git commit -m "chore: refresh HSR live data snapshot"
            git push
          fi
