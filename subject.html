<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Subject Materials · UIB E-Library | Class of 2026</title>
<script>
try{const t=localStorage.getItem("uib-library-theme");if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}
</script>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--surface:#fff;--surface2:#f8f9fd;--ink:#172033;--muted:#687386;--line:#e5e9f1;--blue:#3157d5;--shadow:0 8px 28px #1720330b;--uts:#fff7e7;--uts-line:#f0d49d;--uas:#fff0f0;--uas-line:#efc3c3}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101522;--surface:#192131;--surface2:#202b3e;--ink:#edf2fc;--muted:#a2aec2;--line:#303c50;--blue:#9aafff;--shadow:0 8px 28px #0003;--uts:#382d1c;--uts-line:#71552b;--uas:#3b242b;--uas-line:#75404a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,Segoe UI,Arial,sans-serif;transition:background .2s,color .2s}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:28px 22px}.teacher-line{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:750}.wrap{max-width:1000px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);font-weight:800}h1{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.04em;margin:12px 0 5px}.sub{color:var(--muted)}
main{max-width:1000px;margin:26px auto;padding:0 20px 60px}.back{display:inline-flex;gap:8px;color:var(--blue);font-weight:750;text-decoration:none;margin:0 0 18px}.theme-toggle{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:9px 13px;font:700 13px inherit;cursor:pointer;white-space:nowrap}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;color:var(--muted);font-size:13px}.week-grid{display:grid;grid-template-columns:1fr;gap:0;position:relative;padding:4px 0 4px 8px}.week-grid:before{content:"";position:absolute;left:28px;top:18px;bottom:18px;width:2px;background:var(--line)}
.week{min-width:0;position:relative;margin:0 0 11px 42px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:visible;animation:weekEnter .42s both;animation-delay:calc(var(--i,0)*22ms);transition:border-color .22s,box-shadow .22s,transform .22s}.week:before{content:"";position:absolute;left:-49px;top:23px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--line)}.week:has(.week-toggle[aria-expanded="true"]){border-color:var(--blue);box-shadow:0 7px 22px #17203312;transform:translateX(3px)}.week.uts{background:var(--uts);border-color:var(--uts-line)}.week.uas{background:var(--uas);border-color:var(--uas-line)}.week.uts:before{background:#d69b35}.week.uas:before{background:#d45b68}
.week-toggle{width:100%;min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;color:var(--ink);text-align:left;padding:13px 15px;font:inherit;font-weight:750;cursor:pointer}.week-main{display:flex;align-items:center;gap:12px;min-width:0}.week-number{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:11px;background:var(--surface2);color:var(--blue);font-size:14px;font-weight:850}.uts .week-number{background:#f4dfb9;color:#80520d}.uas .week-number{background:#f2d0d0;color:#8e3030}:root[data-theme="dark"] .uts .week-number{background:#604a28;color:#ffe0a8}:root[data-theme="dark"] .uas .week-number{background:#61343d;color:#ffc5cb}.week-copy{min-width:0}.week-name{display:block;font-size:14px;line-height:1.3}.week-label{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:4px}.week-right{display:flex;align-items:center;gap:9px;flex:0 0 auto}.week.current-week{border:3px solid #3157d5!important;background:#e8eeff!important;box-shadow:0 8px 26px #3157d54a,inset 5px 0 0 #3157d5!important;transform:translateX(4px)}.week.current-week:before{background:#3157d5;box-shadow:0 0 0 4px var(--bg),0 0 0 8px #3157d577}.week.current-week .week-number{background:#3157d5!important;color:#fff!important}.week.current-week .week-name{color:#203d9b;font-weight:900}.week-current-tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#3157d5;color:#fff;font-size:10px;font-weight:900;letter-spacing:.04em;white-space:nowrap}.week.current-week .week-toggle[aria-expanded="true"]{color:#203d9b}:root[data-theme="dark"] .week.current-week{background:#202f50!important;border-color:#9aafff!important;box-shadow:0 8px 26px #9aafff35,inset 5px 0 0 #9aafff!important}:root[data-theme="dark"] .week.current-week .week-number{background:#9aafff!important;color:#101522!important}:root[data-theme="dark"] .week.current-week .week-name{color:#dce5ff}:root[data-theme="dark"] .week.current-week:before{background:#9aafff}.tag{font-size:10px;letter-spacing:.02em;border-radius:20px;padding:5px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}.week-chevron{color:var(--muted);font-size:17px;transition:transform .18s}.week-toggle[aria-expanded="true"] .week-chevron{transform:rotate(180deg)}.uts .tag{background:#f4dfb9;color:#80520d}.uas .tag{background:#f2d0d0;color:#8e3030}:root[data-theme="dark"] .uts .tag{background:#604a28;color:#ffe0a8}:root[data-theme="dark"] .uas .tag{background:#61343d;color:#ffc5cb}
.week-content{padding:0;overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s ease,padding .3s ease}.week-content.open{max-height:700px;opacity:1;padding:0 15px 14px}.files{margin:0;padding:12px 0 0 17px;border-top:1px solid var(--line);display:grid;gap:9px}.files li,.other li{font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-width:0;padding:3px 0}.files a,.other a{color:var(--blue);text-decoration:none;overflow-wrap:anywhere;min-width:0}.file-name{min-width:0;flex:1;overflow-wrap:anywhere}.file-type{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:48px;margin-left:10px;padding:4px 9px;border-radius:7px;font-size:10px;line-height:1.35;font-weight:850;letter-spacing:.045em;background:#eef0f4;color:#596579;border:1px solid #dce1e9}.file-type.pdf{background:#fff0f0;color:#c33242;border-color:#f2c6cb}.file-type.xlsx,.file-type.xls,.file-type.csv{background:#e8f6ed;color:#187343;border-color:#bfe4cc}.file-type.pptx,.file-type.ppt{background:#fff1e7;color:#b85a1b;border-color:#f1d0b8}.file-type.docx,.file-type.doc{background:#eaf2ff;color:#245bb5;border-color:#c8daf8}.file-type.zip,.file-type.rar{background:#f2eaff;color:#7541a5;border-color:#ddcafa}:root[data-theme="dark"] .file-type{background:#30394a;color:#c0cada;border-color:#465268}:root[data-theme="dark"] .file-type.pdf{background:#49272d;color:#ffabb2;border-color:#74414a}:root[data-theme="dark"] .file-type.xlsx,:root[data-theme="dark"] .file-type.xls,:root[data-theme="dark"] .file-type.csv{background:#183d2d;color:#9de2b8;border-color:#2b6849}:root[data-theme="dark"] .file-type.pptx,:root[data-theme="dark"] .file-type.ppt{background:#482f22;color:#ffc49d;border-color:#795035}:root[data-theme="dark"] .file-type.docx,:root[data-theme="dark"] .file-type.doc{background:#203654;color:#a9caff;border-color:#365780}:root[data-theme="dark"] .file-type.zip,:root[data-theme="dark"] .file-type.rar{background:#38294c;color:#d6b5ff;border-color:#594078}.files a:hover,.other a:hover{text-decoration:underline}.empty{font-size:12px;color:var(--muted);font-style:italic;margin-top:12px;padding:10px 12px;background:var(--surface2);border-radius:9px}.week-toggle:hover .week-number{transform:scale(1.06)}.week-number{transition:transform .2s}.week-chevron{transition:transform .25s ease}.week-toggle[aria-expanded="true"] .week-chevron{transform:rotate(180deg)}@keyframes weekEnter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.other,.status{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}.other h2{font-size:17px;margin:0 0 8px}.other ul{margin:0;padding-left:20px;display:grid;gap:7px}.status{color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}[hidden]{display:none!important}
@media(max-width:620px){.week-grid{grid-template-columns:1fr}}\n@media(max-width:560px){header{padding:23px 17px}main{padding:0 14px 42px}.topline{align-items:flex-start}}

/* Motion system: subtle entrances, hover lift and soft ambient light */
@keyframes pageRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes softFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes sheen{0%{background-position:180% 0}100%{background-position:-180% 0}}
@keyframes starBlink{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes heroDrift{0%,100%{background-position:center 38%}50%{background-position:center 48%}}
.card,.metric,.panel,.quick,.leader,.week,.semester-button,.history-card,.news-item,.info-box,.version,.reminder-panel,.task,.search-result,.deadline-home-item{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.card:hover,.metric:hover,.quick:hover,.leader:hover,.week:hover,.semester-button:hover,.history-card:hover,.news-item:hover,.info-box:hover,.task:hover,.search-result:hover{transform:translateY(-4px);box-shadow:0 16px 34px #17203318}
.btn,.theme,.theme-toggle,.nav a,.nav button,.back,.open-link{transition:transform .2s ease,filter .2s ease,background .2s ease}
.btn:hover,.theme:hover,.theme-toggle:hover,.nav a:hover,.nav button:hover,.back:hover,.open-link:hover{transform:translateY(-2px);filter:brightness(1.08)}
header{animation:pageRise .75s both}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}



/* Keep the 16 weekly rows steady when a course opens. */
.week-grid>.week{animation:none!important;animation-delay:0s!important;}

/* Staggered card entrances so each page feels alive without becoming noisy */
.grid>*,.cards>*,.metrics>*,.quick-grid>*,.week-grid>*,.leadership-grid>*,.history-grid>*,.news-list>*{animation:pageRise .62s cubic-bezier(.2,.75,.25,1) both}
.grid>*:nth-child(2),.cards>*:nth-child(2),.metrics>*:nth-child(2),.quick-grid>*:nth-child(2),.week-grid>*:nth-child(2),.leadership-grid>*:nth-child(2),.history-grid>*:nth-child(2),.news-list>*:nth-child(2){animation-delay:.07s}
.grid>*:nth-child(3),.cards>*:nth-child(3),.metrics>*:nth-child(3),.quick-grid>*:nth-child(3),.week-grid>*:nth-child(3),.leadership-grid>*:nth-child(3),.history-grid>*:nth-child(3),.news-list>*:nth-child(3){animation-delay:.14s}
.grid>*:nth-child(4),.cards>*:nth-child(4),.metrics>*:nth-child(4),.quick-grid>*:nth-child(4),.week-grid>*:nth-child(4),.history-grid>*:nth-child(4),.news-list>*:nth-child(4){animation-delay:.21s}
.grid>*:nth-child(5),.cards>*:nth-child(5),.week-grid>*:nth-child(5),.news-list>*:nth-child(5){animation-delay:.28s}
input,select,textarea{transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 13%,transparent)}



/* One shared appearance for the theme control on every page */
#themeToggle{box-sizing:border-box!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;width:124px!important;min-width:124px!important;height:38px!important;min-height:38px!important;padding:0 12px!important;border:1px solid #3157d5!important;border-radius:999px!important;background:#3157d5!important;color:#fff!important;font-family:Inter,Segoe UI,Arial,sans-serif!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important;cursor:pointer!important;box-shadow:0 2px 7px #17203318!important;}
#themeToggle:hover{background:#2548bd!important;border-color:#2548bd!important;transform:translateY(-1px)!important;}
#themeToggle:focus-visible{outline:3px solid #3157d559!important;outline-offset:3px!important;}
</style>
</head>
<body>
<header><div class="wrap">
<div class="topline"><div class="eyebrow">Universitas Internasional Batam · Class of 2026</div><button class="theme-toggle" id="themeToggle" type="button">☾ Dark mode</button></div>
<h1 id="subjectTitle">Loading subject…</h1><div class="sub">Class of 2026 · Weekly course materials</div><div class="teacher-line" id="teacherLine" hidden></div>
</div></header>
<main>
<a class="back" href="index.html">← All subjects</a>
<div class="summary"><span id="weekCount">Loading weekly materials…</span><span>Choose a week to view its files</span></div>
<div id="status" class="status">Connecting to the library…</div>
<div id="weeks" class="week-grid"></div>
<section id="other" class="other" hidden><h2>Other subject files</h2><ul id="otherFiles"></ul></section>
</main>
<footer>UIB E-Library · Class of 2026 · Materials hosted on Google Drive</footer>
<script>
const API="https://script.google.com/macros/s/AKfycbxTnLjon94xy4pum1O410O5pHHgjOk8FglMDtDFnteo6oJCttYX_Q3aV0_6xO15ocaEkA/exec";
const $=id=>document.getElementById(id);const folderId=new URLSearchParams(location.search).get("folder");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function weekNumber(name){const m=String(name).match(/week\s*(\d+)/i);return m?Number(m[1]):999;}
// Week 11 begins Monday, 9 November 2026. The highlighted week advances every Monday.
const CURRENT_WEEK_ANCHOR = "2026-11-09";
function getCurrentAcademicWeek(){const now=new Date(),todayUtc=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()),[y,m,d]=CURRENT_WEEK_ANCHOR.split("-").map(Number),anchorUtc=Date.UTC(y,m-1,d);return 11+Math.floor((todayUtc-anchorUtc)/604800000);}
function lecturer(name){const n=String(name).toLowerCase().replace(/[^a-z0-9]/g,"");const entries=[["agama","Kelen"],["bahasaindonesia","Wike Oriza, S.S., M.Pd."],["bahasainggris","Risqa Meilani"],["labpengantarakuntansi","Anthehock Zhang"],["laboratoriumpengantarakuntansi","Anthehock Zhang"],["matematikabisnis","Serly, S.E., M.M."],["pengantarakuntansi","Dr. Supriyanto, S.E., M.M., Ak., BKP., ASEAN CPA."],["pengantarmanajemendanbisnis","Reza Pramata Apriyanti, S.E., M.Ak., RSA"]];const found=entries.find(([key])=>n===key||n.includes(key));return found?found[1]:"";}
function fileLink(f){const url=f.previewUrl||("https://drive.google.com/file/d/"+f.id+"/preview");const ext=(String(f.name).split(".").pop()||"").toLowerCase();const known=["pdf","xlsx","xls","csv","pptx","ppt","docx","doc","zip","rar"];const type=known.includes(ext)?ext:"file";return '<li><a class="file-name" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a><span class="file-type '+type+'">'+esc(ext.toUpperCase()||"FILE")+'</span></li>';}
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem("uib-library-theme",theme);}catch(e){}$("themeToggle").textContent=theme==="dark"?"☀ Light mode":"☾ Dark mode";}
function initTheme(){setTheme(document.documentElement.dataset.theme==="dark"?"dark":"light");}
$("themeToggle").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));initTheme();
function render(data){
 const course=(data.folders||[]).find(x=>x.id===folderId);
 if(!course){$("subjectTitle").textContent="Subject not found";$("status").hidden=false;$("status").textContent="This subject could not be found. Return to the library and choose a subject again.";$("weekCount").textContent="";return;}
 document.title=course.name+" · UIB E-Library | Class of 2026";$("subjectTitle").textContent=course.name;const teacher=lecturer(course.name);if(teacher){$("teacherLine").textContent="Lecturer · "+teacher;$("teacherLine").hidden=false;}
 const folders=(course.folders||[]).filter(x=>/^week\s*\d+/i.test(x.name));
 const weekMap=new Map();folders.forEach(w=>{const n=weekNumber(w.name);if(n>=1&&n<=16){if(!weekMap.has(n))weekMap.set(n,[]);weekMap.get(n).push(...(w.files||[]));}});
 const total=[...weekMap.values()].reduce((n,files)=>n+files.length,0);
 const currentWeek=getCurrentAcademicWeek();
 $("weekCount").textContent="16-week schedule · "+total+" files";$("status").hidden=true;
 const emptyMessages=["The files are playing hide-and-seek. Nobody has found them yet. 🙈","A little academic tumbleweed rolled through here. Nothing uploaded yet. 🌵","This week is currently powered by hopes, dreams, and absolutely zero files. ✨","The lecturer has entered stealth mode. Materials not spotted yet. 🥷","Your future notes are still in the making. Check back soon! 🛠️","So empty, even the echo is echoing. 📢"];
 $("weeks").innerHTML=Array.from({length:16},(_,i)=>{
  const n=i+1,isCurrent=n===currentWeek,files=(weekMap.get(n)||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const kind=n===8?"uts":n===16?"uas":"",label=n===8?"UTS · Ujian Tengah Semester":n===16?"UAS · Ujian Akhir Semester":"";
  const content=files.length?'<ul class="files">'+files.map(fileLink).join("")+'</ul>':'<div class="empty">'+(label?"Exam week. May the grades be ever in your favour. 🍀":emptyMessages[(n-1)%emptyMessages.length])+'</div>';
  return '<article class="week '+kind+(isCurrent?' current-week':'')+'" style="--i:'+i+'"><button class="week-toggle" type="button" aria-expanded="false"><span class="week-main"><span class="week-number">'+String(n).padStart(2,"0")+'</span><span class="week-copy"><span class="week-name">Week '+n+'</span>'+(label?'<span class="week-label">'+label+'</span>':'')+'</span></span><span class="week-right">'+(isCurrent?'<span class="week-current-tag">CURRENT WEEK</span>':'')+'<span class="tag">'+(files.length?files.length+" files":label?"Exam week":"Awaiting materials")+'</span><span class="week-chevron" aria-hidden="true">⌄</span></span></button><div class="week-content">'+content+'</div></article>';
 }).join("");
 document.querySelectorAll(".week-toggle").forEach(btn=>btn.addEventListener("click",()=>{
  const panel=btn.nextElementSibling,opening=btn.getAttribute("aria-expanded")!=="true";
  btn.setAttribute("aria-expanded",String(opening));panel.classList.toggle("open",opening);
 }));
 const other=(course.files||[]).filter(f=>!/^00\s*-\s*index\.html$/i.test(f.name));
 if(other.length){$("other").hidden=false;$("otherFiles").innerHTML=other.map(fileLink).join("");}
}
function load(){if(!folderId){$("subjectTitle").textContent="No subject selected";$("status").textContent="Return to the library and select a subject.";return;}
 let hasCache=false;try{const saved=localStorage.getItem("uib-online-library-cache-v1");if(saved){const cached=JSON.parse(saved);if(cached&&Array.isArray(cached.folders)){render(cached);hasCache=true;}}}catch(e){}
 const callback="uibSubjectCallback";let finished=false;const s=document.createElement("script");const timeout=setTimeout(()=>{if(!finished&&!hasCache)$("status").textContent="The library is taking longer than usual to respond. Please wait or refresh.";},12000);
 window[callback]=data=>{finished=true;clearTimeout(timeout);try{render(data);try{localStorage.setItem("uib-online-library-cache-v1",JSON.stringify(data));}catch(e){}}catch(e){if(!hasCache)$("status").textContent="Could not display subject materials: "+e.message;}};
 s.src=API+"?callback="+callback+"&_="+Date.now();s.onerror=()=>{finished=true;clearTimeout(timeout);if(!hasCache)$("status").textContent="Could not connect to Google Drive. Check the deployment and sharing permissions.";};document.head.appendChild(s);
}
load();
</script>
